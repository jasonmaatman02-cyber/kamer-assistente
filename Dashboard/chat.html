<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <link rel="stylesheet" href="/static/styles/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/styles/chat.css">
</head>
<body>
  {% include '_sidebar.html' %}

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h3><i class="fa fa-robot"></i> AI Chat Assistant</h3>
      <a class="settings-btn" href="/settings"><i class="fa fa-gear"></i> Settings</a>
    </div>

    <div class="chat-container">
      <div class="chat-window" id="chatWindow">
        <div class="chat-bubble ai">Hey Jason! Hoe kan ik je helpen?</div>
      </div>

      <div class="chat-input-area">
        <textarea id="userInput" class="chat-input" placeholder="Typ hier..."></textarea>
        <button class="send-btn" id="sendBtn"><i class="fa fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="static/scripts/chat.js"></script>
</body>
</html>
