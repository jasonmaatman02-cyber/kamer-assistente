<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security System - Full Camera</title>
  <link rel="stylesheet" href="/static/styles/camera.css">
  <link rel="stylesheet" href="/static/styles/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  {% include '_sidebar.html' %}


  <div class="main">
    <div class="topbar">
      <h3><i class="fa fa-video"></i> Security System</h3>
      <a class="settings-btn" href="/settings"><i class="fa fa-gear"></i> Settings</a>
    </div>

    <!-- Fullscreen camera card -->
    <div class="card recording-card">
      <h3><i class="fa fa-eye"></i> Live Camera Feed</h3>
      <div class="camera-container">
        <img src="/video_feed" alt="Live Camera" class="camera-feed">
        <canvas class="canvas" id="canvas"></canvas>
      </div>
      <p id="camera-status">Status: <span class="red">Idle</span></p>
    </div>

  </div>
  <script src="/static/scripts/camera.js"></script>
</body>
</html>
