<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home - Notes &amp; Alarms</title>
  <link rel="stylesheet" href="/static/styles/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  {% include '_sidebar.html' %}
  <div class="main">
    <div class="topbar">
      <h3><i class="fa fa-note-sticky"></i> Notes &amp; Alarms</h3>
      <a class="settings-btn" href="/settings"><i class="fa fa-gear"></i> Settings</a>
    </div>

    <div class="grid">
      <div class="card wide">
        <h3><i class="fa fa-note-sticky"></i> Notities</h3>
        <div class="field row">
          <input type="text" id="note-input" placeholder="Nieuwe notitie…">
          <button class="btn primary" id="note-add">Toevoegen</button>
        </div>
        <table class="data-table" style="margin-top:12px">
          <tbody id="notes-body"><tr><td class="muted">laden…</td></tr></tbody>
        </table>
      </div>

      <div class="card">
        <h3><i class="fa fa-clock"></i> Wekker</h3>
        <p class="muted">De wekker wordt gezet via de spraakassistent (bedtijd-routine).
          Handmatig zetten vanaf het dashboard komt hier later.</p>
        <div class="field"><label for="alarm">Tijd</label><input type="time" id="alarm"></div>
        <button class="btn" id="alarm-set" disabled>Binnenkort</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/static/scripts/util.js"></script>
  <script src="/static/scripts/notes.js"></script>
</body>
</html>
