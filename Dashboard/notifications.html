<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home - Notifications</title>
  <link rel="stylesheet" href="/static/styles/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  {% include '_sidebar.html' %}
  <div class="main">
    <div class="topbar">
      <h3><i class="fa fa-envelope"></i> Notifications</h3>
      <button class="btn small" id="refresh"><i class="fa fa-rotate"></i> Verversen</button>
    </div>
    <div class="grid">
      <div class="card full" style="height:auto">
        <h3><i class="fa fa-list"></i> Recente gebeurtenissen <span class="muted" id="date"></span>
          <span class="muted" id="new-count" style="float:right"></span></h3>
        <div class="field row" style="gap:10px;margin-bottom:10px;flex-wrap:wrap">
          <select id="f-subject" style="min-width:140px"><option value="">Alle onderwerpen</option></select>
          <input type="text" id="f-text" placeholder="zoeken…" style="flex:1;min-width:120px">
          <button class="btn small" id="mark-read">Gezien</button>
        </div>
        <table class="data-table">
          <thead><tr><th style="width:90px">Tijd</th><th style="width:140px">Onderwerp</th><th>Bericht</th></tr></thead>
          <tbody id="log-body"><tr><td colspan="3" class="muted">laden…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="/static/scripts/util.js"></script>
  <script src="/static/scripts/notifications.js"></script>
</body>
</html>
