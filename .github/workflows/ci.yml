name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libs (vlc / portaudio)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvlc-dev vlc portaudio19-dev

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dashboard.txt
          pip install pytest requests

      - name: Compile everything
        run: python -m compileall -q config ai logic voice devices sound_system scheduler weer Dashboard main.py rundashboard.py

      - name: Tests
        run: pytest -q
