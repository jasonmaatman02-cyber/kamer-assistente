name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Bewust een zone die noch de Pi (Europe/Amsterdam) noch de runner (UTC) is: de tests horen niet van de
      # tijdzone van de machine af te hangen (dat brak de CI sinds de agenda-tijdzonefix).
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libs (vlc / portaudio)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvlc-dev vlc portaudio19-dev

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dashboard.txt
          pip install pytest requests

      - name: Lint (syntaxfouten en ongebruikte of ontbrekende namen)
        run: |
          pip install ruff
          ruff check --isolated --select E9,F .

      - name: Compile everything
        run: python -m compileall -q config ai logic voice devices sound_system scheduler weer Dashboard main.py rundashboard.py

      - name: Tests
        run: pytest -q
